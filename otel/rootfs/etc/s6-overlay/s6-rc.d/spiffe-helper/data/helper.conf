# The SPIRE Workload API socket exposed by the local agent.
agent_address = "/run/spire/agent.sock"

# Which workload to request SVIDs for.
hint = "otel"

# Ephemeral files recreated on each add-on start and rotated by the helper.
cert_dir              = "/run/spire/svid"
svid_file_name        = "tls.crt"
svid_key_file_name    = "tls.key"
svid_bundle_file_name = "ca.crt"

# Stay subscribed and rewrite files before the SVID expires.
daemon_mode = true

# The collector only needs to read these; it runs as root initially.
cert_file_mode = 0444
key_file_mode  = 0400

# JWT
jwt_svid_file_mode = 0400
jwt_svids = [{
  jwt_audience       = "otel.monitoring.internal"
  jwt_svid_file_name = "otel.token"
}]
