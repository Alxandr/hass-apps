extensions:
  health_check:
    endpoint: 127.0.0.1:13133
  bearertokenauth/otel:
    filename: /run/spire/svid/otel.token

receivers:
  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu:
      memory:
      load:
      disk:
      network:
      paging:
      filesystem:
        metrics:
          system.filesystem.utilization:
            enabled: true
        exclude_mount_points:
          match_type: regexp
          mount_points:
            - ^/dev($|/)
            - ^/proc($|/)
            - ^/sys($|/)
        exclude_fs_types:
          match_type: strict
          fs_types:
            - autofs
            - bpf
            - cgroup2
            - configfs
            - debugfs
            - devpts
            - devtmpfs
            - fusectl
            - hugetlbfs
            - mqueue
            - nsfs
            - overlay
            - proc
            - procfs
            - pstore
            - securityfs
            - sysfs
            - tracefs

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 64
    spike_limit_mib: 16
  resource/home_assistant:
    attributes:
      - key: host.name
        value: home-assistant
        action: upsert
  batch:
    timeout: 10s

exporters:
  otlp/gateway:
    endpoint: otel.monitoring.internal:443
    auth:
      authenticator: bearertokenauth/otel

service:
  extensions: [health_check, bearertokenauth/otel]
  pipelines:
    metrics:
      receivers: [hostmetrics]
      processors: [memory_limiter, resource/home_assistant, batch]
      exporters: [otlp/gateway]
